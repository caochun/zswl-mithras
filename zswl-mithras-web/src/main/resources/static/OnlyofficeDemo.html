<html>
	<head>
		<meta charset="UTF-8">
		<title>OnlyOffice编辑测试</title>
		<!-- 引入外部JavaScript文件 -->
		<script type="text/javascript" src="http://mithras-onlyoffice.zswl.cn:8888/web-apps/apps/api/documents/api.js"></script>
<!--		<script type="text/javascript" src="http://192.168.0.56:9080/web-apps/apps/api/documents/api.js"></script>-->
		<script type="text/javascript" src="./jquery-3.6.0.min.js"></script>
	</head>
	<body onload="init()">
        <div id="placeholder"></div>
        <script language="javascript" type="text/javascript">
			function getQueryVariable(variable)
			{
				var query = window.location.search.substring(1);
				var vars = query.split("&");
				for (var i=0;i<vars.length;i++) {
					var pair = vars[i].split("=");
					if(pair[0] == variable){return pair[1];}
				}
				return(null);
			}
			function init() {
				let reqData = {
					'moduleType': `${getQueryVariable('moduleType')}`,
					'id': `${getQueryVariable('id')}`,
					'operate': `${getQueryVariable('operate')}`,
					'windowType': `${getQueryVariable('windowType')}`,
				}
				console.log(JSON.stringify(reqData));
				$.ajax({
					url:"/onlyoffice/docDetail",
					method: "post",
					contentType: "application/json; charset=utf-8",
					dataType: "json",
					data: JSON.stringify(reqData),
					success: function(result){
						console.log(result)
						var docEditor = new DocsAPI.DocEditor("placeholder", result.data);
					},
					error: function(data){
						alert("文件不存在或该文件类型无法预览")
					}
				});
			}
        </script>
	</body>
</html>
